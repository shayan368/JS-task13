<!DOCTYPE html>
<html>

<head>
  <title>Async/Await User Data</title>
</head>
<style>
  body {
    padding: 0;
    margin: 0;
    background-color: aquamarine;
  }

  .container {
    border: 2px solid rgb(14, 189, 87);
    background-color: rgb(14, 189, 87);
    border-radius: 10px;
    box-shadow: black;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-left: 200px;
    margin-right: 200px;
    margin-top: 50px;
  }

  #user-list {
    color: white;
  }
</style>

<body>

  AsyncAwait & Fetch API
  <div class="container">
    <h1>User List</h1>
    <div id="loading">Loading...</div>
    <ul id="user-list"></ul>
  </div>

  <script>
    async function getUserData() {
      const loading = document.getElementById('loading');
      const userList = document.getElementById('user-list');

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users');
        const users = await response.json();
        loading.style.display = 'none';

        users.forEach(user => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${user.name}</strong> (${user.email}) - Company: ${user.company.name}`;
          userList.appendChild(li);
        });
      } catch (error) {
        loading.textContent = 'Failed to load user data.';
        console.error('Error:', error);
      }
    }

    getUserData();
  </script>
</body>

</html>
